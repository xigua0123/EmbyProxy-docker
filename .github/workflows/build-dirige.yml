name: Build Dirige EmbyProxy
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binary and calculate sha256
        id: relay_info
        run: |
          cd Dirige
          curl -fsSL https://raw.githubusercontent.com/Dirige/EMBY_CF/master/personal/bin/emby-relay-linux-amd64 -o emby-relay
          chmod +x emby-relay
          SHA=$(sha256sum emby-relay | awk '{print $1}')
          echo "RELAY_SHA=$SHA" >> $GITHUB_OUTPUT
          echo "Current relay sha256: $SHA"

      - name: Cache by binary hash
        id: cache_hit
        uses: actions/cache@v4
        with:
          path: .cache/dirige_sha.txt
          key: dirige-${{ steps.relay_info.outputs.RELAY_SHA }}
          restore-keys: |
            dirige-

      - name: Skip build if no change
        if: steps.cache_hit.outputs.cache-hit == 'true'
        run: |
          echo "✅ Dirige 二进制文件无更新，跳过构建"
          echo "SKIP_BUILD=1" >> $GITHUB_ENV

      - name: Login DockerHub
        if: env.SKIP_BUILD != '1'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        if: env.SKIP_BUILD != '1'
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        if: env.SKIP_BUILD != '1'
        uses: docker/build-push-action@v5
        with:
          context: ./Dirige
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/embyproxy-dirige:latest

      - name: Save hash marker
        if: env.SKIP_BUILD != '1'
        run: |
          mkdir -p .cache
          echo ${{ steps.relay_info.outputs.RELAY_SHA }} > .cache/dirige_sha.txt
