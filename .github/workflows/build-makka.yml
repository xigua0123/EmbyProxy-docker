name: Build MakkaPakka EmbyProxy
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server.js & panel.html, calc sha256
        id: file_info
        run: |
          mkdir -p .tmp-makka
          cd .tmp-makka
          curl -fsSL https://raw.githubusercontent.com/MakkaPakka518/EmbyProxy-VPS/main/server.js -o server.js
          curl -fsSL https://raw.githubusercontent.com/MakkaPakka518/EmbyProxy-VPS/main/panel.html -o panel.html
          COMBINED_SHA=$(cat server.js panel.html | sha256sum | awk '{print $1}')
          echo "FILES_SHA=$COMBINED_SHA" >> $GITHUB_OUTPUT
          echo "server.js + panel.html sha256: $COMBINED_SHA"

      - name: Cache file hash
        id: cache_hash
        uses: actions/cache@v4
        with:
          path: .cache/makka_sha.txt
          key: makka-${{ steps.file_info.outputs.FILES_SHA }}
          restore-keys: |
            makka-

      - name: Skip build if no change
        if: steps.cache_hash.outputs.cache-hit == 'true'
        run: |
          echo "✅ MakkaPakka 文件无变化，跳过构建"
          echo "SKIP_BUILD=1" >> $GITHUB_ENV

      - name: Clone upstream source
        if: env.SKIP_BUILD != '1'
        run: |
          rm -rf MakkaPakka/*
          git clone --depth 1 https://github.com/MakkaPakka518/EmbyProxy-VPS.git .tmp-src
          cp -r .tmp-src/* MakkaPakka/
          rm -rf .tmp-src

      - name: Login DockerHub
        if: env.SKIP_BUILD != '1'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        if: env.SKIP_BUILD != '1'
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        if: env.SKIP_BUILD != '1'
        uses: docker/build-push-action@v5
        with:
          context: ./MakkaPakka
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/embyproxy-makkapakka:latest

      - name: Save new hash marker
        if: env.SKIP_BUILD != '1'
        run: |
          mkdir -p .cache
          echo ${{ steps.file_info.outputs.FILES_SHA }} > .cache/makka_sha.txt
