name: Build MakkaPakka EmbyProxy
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone upstream & calculate combined sha256
        id: file_info
        run: |
          git clone --depth 1 https://github.com/MakkaPakka518/EmbyProxy-VPS.git .tmp-src
          COMBINED_SHA=$(cd .tmp-src && cat server.js panel.html | sha256sum | awk '{print $1}')
          echo "FILES_SHA=$COMBINED_SHA" >> $GITHUB_OUTPUT
          echo "server.js + panel.html sha256: $COMBINED_SHA"

      - name: Cache file hash
        id: cache_hit
        uses: actions/cache@v4
        with:
          path: .cache/makka_sha.txt
          key: makka-${{ steps.file_info.outputs.FILES_SHA }}
          restore-keys: |
            makka-

      - name: Skip build if no change
        if: steps.cache_hit.outputs.cache-hit == 'true'
        run: |
          echo "✅ MakkaPakka 文件无变化，跳过构建"
          echo "SKIP_BUILD=1" >> $GITHUB_ENV

      - name: Prepare temp build dir（不改动仓库MakkaPakka文件夹）
        if: env.SKIP_BUILD != '1'
        run: |
          mkdir -p build-makka
          cp -r .tmp-src/* build-makka/
          cp MakkaPakka/Dockerfile build-makka/
          rm -rf .tmp-src

      - name: Login DockerHub
        if: env.SKIP_BUILD != '1'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        if: env.SKIP_BUILD != '1'
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        if: env.SKIP_BUILD != '1'
        uses: docker/build-push-action@v5
        with:
          context: ./build-makka
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/embyproxy-makkapakka:latest

      - name: Save hash marker
        if: env.SKIP_BUILD != '1'
        run: |
          mkdir -p .cache
          echo ${{ steps.file_info.outputs.FILES_SHA }} > .cache/makka_sha.txt
