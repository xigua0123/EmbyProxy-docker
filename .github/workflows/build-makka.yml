name: Build MakkaPakka EmbyProxy
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      SKIP_BUILD: ${{ steps.check.outputs.SKIP_BUILD }}
      FILES_SHA: ${{ steps.check.outputs.FILES_SHA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch server.js & panel.html and calc sha
        run: |
          curl -fsSL https://raw.githubusercontent.com/MakkaPakka518/EmbyProxy-VPS/main/server.js -o server.js
          curl -fsSL https://raw.githubusercontent.com/MakkaPakka518/EmbyProxy-VPS/main/panel.html -o panel.html
          FILES_SHA=$(cat server.js panel.html | sha256sum | awk '{print $1}')
          echo "FILES_SHA=$FILES_SHA" >> $GITHUB_OUTPUT
          echo "server.js + panel.html sha256: $FILES_SHA"
          if [ -f .cache/makka_sha.txt ]; then
            OLD=$(cat .cache/makka_sha.txt)
            if [ "$OLD" = "$FILES_SHA" ]; then
              echo "SKIP_BUILD=1" >> $GITHUB_OUTPUT
            else
              echo "SKIP_BUILD=0" >> $GITHUB_OUTPUT
            fi
          else
            echo "SKIP_BUILD=0" >> $GITHUB_OUTPUT
          fi
      - name: Save new sha mark
        if: steps.check.outputs.SKIP_BUILD != '1'
        run: |
          mkdir -p .cache
          echo ${{ steps.check.outputs.FILES_SHA }} > .cache/makka_sha.txt

  build:
    needs: pre-check
    if: needs.pre-check.outputs.SKIP_BUILD != '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone upstream & prepare build dir
        run: |
          git clone --depth 1 https://github.com/MakkaPakka518/EmbyProxy-VPS.git .tmp-src
          mkdir -p build-makka
          cp -r .tmp-src/* build-makka/
          cp MakkaPakka/Dockerfile build-makka/
          rm -rf .tmp-src

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch & push latest
        uses: docker/build-push-action@v5
        with:
          context: ./build-makka
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/embyproxy-makkapakka:latest
