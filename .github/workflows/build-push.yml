name: Build & Push EMBY_CF Relay
on:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时拉一次上游最新二进制
  workflow_dispatch:          # 支持网页手动点按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest relay binary from upstream
        run: |
          curl -fsSL https://raw.githubusercontent.com/Dirige/EMBY_CF/master/personal/bin/emby-relay-linux-amd64 -o emby-relay
          chmod +x emby-relay
          ls -la emby-relay
          echo "Binary SHA256:"
          sha256sum emby-relay

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/emby-cf-relay:latest
