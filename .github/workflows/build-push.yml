name: Build Both Emby Proxy
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-dirige:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download relay binary & calculate sha256
        id: dirige_info
        run: |
          mkdir -p build-dirige
          cd build-dirige
          curl -fsSL https://raw.githubusercontent.com/Dirige/EMBY_CF/master/personal/bin/emby-relay-linux-amd64 -o emby-relay
          chmod +x emby-relay
          SHA=$(sha256sum emby-relay | awk '{print $1}')
          echo "RELAY_SHA=$SHA" >> $GITHUB_OUTPUT
          echo "Current relay sha256: $SHA"

          cat > Dockerfile <<EOF
FROM alpine:latest
WORKDIR /app
COPY emby-relay /app/emby-relay
RUN chmod +x /app/emby-relay \
    && apk add --no-cache tzdata \
    && cp /usr/share/zoneinfo/Asia/Shanghai /etc/localtime \
    && echo "Asia/Shanghai" > /etc/timezone
VOLUME ["/etc/emby-relay"]
EXPOSE 2087
ENTRYPOINT ["/app/emby-relay"]
EOF

          cat > docker-entrypoint.sh <<'EOF'
#!/bin/sh
set -e
CFG=/etc/emby-relay/config.json
mkdir -p /etc/emby-relay

if [ ! -s "$CFG" ] || ! grep -q '"secret"' "$CFG" 2>/dev/null; then
  BOOT_SECRET="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' | cut -c1-32)"
  cat > "$CFG" <<JSON
{"port": 2087, "secret": "$BOOT_SECRET", "verify_upstream_tls": true, "monthly_limit_bytes": 9895604649984, "per_ip_daily_limit_bytes": 32212254720, "per_ip_max_conns": 8, "allow_cf_ips_only": true}
JSON
  chmod 600 "$CFG"
  echo "================================================"
  echo "  首次启动，引导密钥（Boot Secret）："
  echo "  $BOOT_SECRET"
  echo "================================================"
fi

exec /app/emby-relay
EOF
          chmod +x docker-entrypoint.sh

      - name: Cache Dirige relay hash
        id: cache_dirige
        uses: actions/cache@v4
        with:
          path: .cache/dirige_sha.txt
          key: dirige-${{ steps.dirige_info.outputs.RELAY_SHA }}
          restore-keys: |
            dirige-

      - name: Skip check for Dirige
        if: steps.cache_dirige.outputs.cache-hit == 'true'
        run: |
          echo "✅ Dirige relay 未更新，跳过构建推送"
          echo "SKIP_BUILD=1" >> $GITHUB_ENV

      - name: Login DockerHub
        if: env.SKIP_BUILD != '1'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx
        if: env.SKIP_BUILD != '1'
        uses: docker/setup-buildx-action@v3

      - name: Build & Push embyproxy-dirige
        if: env.SKIP_BUILD != '1'
        uses: docker/build-push-action@v5
        with:
          context: ./build-dirige
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/embyproxy-dirige:latest

      - name: Save hash marker
        if: env.SKIP_BUILD != '1'
        run: |
          mkdir -p .cache
          echo ${{ steps.dirige_info.outputs.RELAY_SHA }} > .cache/dirige_sha.txt

  build-makkapakka:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server.js & panel.html, calculate combined sha256
        id: makka_info
        run: |
          mkdir -p build-makkapakka/check
          cd build-makkapakka/check
          curl -fsSL https://raw.githubusercontent.com/MakkaPakka518/EmbyProxy-VPS/main/server.js -o server.js
          curl -fsSL https://raw.githubusercontent.com/MakkaPakka518/EmbyProxy-VPS/main/panel.html -o panel.html
          # 两个文件内容拼一起算哈希，任一文件变化都会触发重建
          COMBINED_SHA=$(cat server.js panel.html | sha256sum | awk '{print $1}')
          echo "FILES_SHA=$COMBINED_SHA" >> $GITHUB_OUTPUT
          echo "server.js + panel.html combined sha256: $COMBINED_SHA"

      - name: Cache MakkaPakka files hash
        id: cache_makka
        uses: actions/cache@v4
        with:
          path: .cache/makka_sha.txt
          key: makka-${{ steps.makka_info.outputs.FILES_SHA }}
          restore-keys: |
            makka-

      - name: Skip check for MakkaPakka
        if: steps.cache_makka.outputs.cache-hit == 'true'
        run: |
          echo "✅ MakkaPakka server.js/panel.html 无变化，跳过构建推送"
          echo "SKIP_BUILD=1" >> $GITHUB_ENV

      - name: Clone upstream MakkaPakka
        if: env.SKIP_BUILD != '1'
        run: |
          git clone --depth 1 https://github.com/MakkaPakka518/EmbyProxy-VPS.git build-makkapakka/repo
          cd build-makkapakka/repo
          cat > Dockerfile <<EOF
FROM node:22-alpine
WORKDIR /app
COPY . ./
EXPOSE 3333
VOLUME ["/app/data"]
CMD ["node","server.js"]
EOF

      - name: Login DockerHub
        if: env.SKIP_BUILD != '1'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx
        if: env.SKIP_BUILD != '1'
        uses: docker/setup-buildx-action@v3

      - name: Build & Push embyproxy-makkapakka
        if: env.SKIP_BUILD != '1'
        uses: docker/build-push-action@v5
        with:
          context: ./build-makkapakka/repo
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/embyproxy-makkapakka:latest

      - name: Save hash marker
        if: env.SKIP_BUILD != '1'
        run: |
          mkdir -p .cache
          echo ${{ steps.makka_info.outputs.FILES_SHA }} > .cache/makka_sha.txt
